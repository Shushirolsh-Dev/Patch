services:
  - type: web
    name: patch
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: DATABASE_PATH
        value: /var/data/patch.db
    disk:
      name: patch-data
      mountPath: /var/data
      sizeGB: 1
