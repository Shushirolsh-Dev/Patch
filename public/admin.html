<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Patch Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/">p. Patch</a><a href="/">Public changelog ↗</a></header><main class="admin"><section id="login"><h1>Welcome <i>back.</i></h1><form id="login-form"><label>Admin token<input id="token" type="password" required></label><button>Open dashboard</button><p id="login-error"></p></form></section><section id="dashboard" hidden><h1>Release desk.</h1><button id="logout">Sign out</button><div class="columns"><form id="editor" class="card"><input id="id" type="hidden"><label>Title<input id="title" maxlength="100" required></label><div class="row"><label>Version<input id="version" maxlength="32" required></label><label>Category<select id="kind"><option>New</option><option>Improved</option><option>Fixed</option><option>Security</option></select></label></div><label>Content<textarea id="content" rows="8" maxlength="12000" required></textarea></label><label><input id="published" type="checkbox" checked> Publish immediately</label><p id="save-error"></p><button id="save">Publish release</button><button type="button" id="clear">Clear</button></form><section class="card"><small>YOUR RELEASES <span id="total">0</span></small><div id="releases"></div></section></div></section></main><script src="/admin.js" defer></script></body></html>
